appId: com.standtrain.claudecli.installer
productName: Claude CLI 便携安装器
copyright: Copyright (c) 2026 standtrain
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - deploy/cc-custom.ps1
  - package.json
asar: true
# 内置离线 claude.exe 放在 asar 外（resources/deploy/），供网络全失败时作为最终兜底；
# 需把与固定版本 pin 一致的 claude.exe 放入 deploy/（该文件被 .gitignore 忽略，不入库）。
# 使用目录 + filter：文件缺失时构建仍可成功，仅缺少离线兜底能力。
extraResources:
  - from: deploy
    to: deploy
    filter:
      - claude.exe
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: requireAdministrator
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - zh_CN
  language: '2052'
portable:
  artifactName: ClaudeCLIInstaller-Portable-${version}.exe
  requestExecutionLevel: admin
